name: Deploy Frontend

on:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/deploy_frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Nuxt SSR
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build

      - name: Archive build artifacts
        working-directory: frontend
        run: |
          tar -czf build.tar.gz .output

      - name: Upload build artifacts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/build.tar.gz"
          target: "~/projects/blog/frontend"
          strip_components: 1

      - name: Deploy on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "加载 Node 环境"

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            nvm use 24.14.0

            APP_DIR="$HOME/projects/blog/frontend"

            cd "$APP_DIR"

            echo "解压构建产物"

            rm -rf .output

            tar -xzf build.tar.gz

            rm -f build.tar.gz


            echo "重启服务"

            if pm2 describe blog-frontend > /dev/null 2>&1; then
              pm2 restart blog-frontend --update-env
            else
              pm2 start .output/server/index.mjs \
                --name blog-frontend \
                --update-env
            fi


            pm2 save

            echo "部署完成"
