name: Deploy Frontend

on:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - "mise.toml"
      - ".github/workflows/deploy_frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Show tool versions
        run: |
          node -v
          pnpm -v

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Nuxt SSR
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build

      - name: Archive build artifacts
        working-directory: frontend
        run: tar -czf build.tar.gz .output

      - name: Upload build artifacts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: |
            mise.toml,frontend/build.tar.gz
          target: "~/projects/blog"
          strip_components: 0

      - name: Deploy on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            PROJECT_DIR="$HOME/projects/blog"
            APP_DIR="$PROJECT_DIR/frontend"

            #
            # 安装 mise
            #
            export PATH="$HOME/.local/bin:$PATH"

            if ! command -v mise >/dev/null 2>&1; then
              curl https://mise.run | sh
              export PATH="$HOME/.local/bin:$PATH"
            fi

            eval "$(mise activate bash)"

            #
            # 安装 Node / pnpm（根据 mise.toml）
            #
            cd "$PROJECT_DIR"

            mise install

            #
            # 安装 pm2（如不存在）
            #
            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            echo "========== Versions =========="
            echo "Node : $(node -v)"
            echo "pnpm : $(pnpm -v)"
            echo "pm2  : $(pm2 -v)"
            echo "=============================="

            cd "$APP_DIR"

            if [ ! -f build.tar.gz ]; then
              echo "build.tar.gz not found!"
              exit 1
            fi

            echo "Extract build..."

            rm -rf .output
            tar -xzf build.tar.gz
            rm -f build.tar.gz

            echo "Restart service..."

            if pm2 describe blog-frontend >/dev/null 2>&1; then
              pm2 restart blog-frontend --update-env
            else
              pm2 start .output/server/index.mjs \
                --name blog-frontend \
                --update-env
            fi

            pm2 save

            echo "Deploy completed."
